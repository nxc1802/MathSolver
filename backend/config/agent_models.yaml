version: 2

defaults:
  temperature: 0.1
  max_tokens: 8192
  timeout_seconds: 300

retry_policy:
  retryable_errors:
    - rate_limit
    - timeout
    - connection
    - server_error

  non_retryable_errors:
    - invalid_request
    - authentication

agents:

  ocr:
    name: ocr
    description: "Local visual OCR using Pix2Text. Pure perception — no LLM hallucination."

    tiers:
      - model: gemini/gemini-3.5-flash-lite
        max_attempts: 1
        reasoning_effort: low

    temperature: 0.1
    max_tokens: 4096
    timeout_seconds: 120

    confidence_gateway:
      enabled: true
      threshold: 0.85

      correction:
        enabled: true
        model: gemini/gemini-3.5-flash-lite
        temperature: 0.1
        max_tokens: 4096
        timeout_seconds: 60
        max_attempts: 1
        reasoning_effort: low


  geometry_parser:
    name: geometry_parser
    description: "Semantic geometry parsing and Geometry DSL generation"

    tiers:
      - model: gemini/gemini-3.5-flash-lite
        max_attempts: 1
        reasoning_effort: low

      - model: gemini/gemini-3.5-flash
        max_attempts: 1
        reasoning_effort: medium

    temperature: 0.1
    max_tokens: 16384
    timeout_seconds: 120


  reasoning_solver:
    name: reasoning_solver
    description: "Program-aided mathematical reasoning with SymPy verification"

    tiers:
      - model: gemini/gemini-3.7-flash
        max_attempts: 2
        reasoning_effort: high

    temperature: 0.1
    max_tokens: 16384
    timeout_seconds: 300

