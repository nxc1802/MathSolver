version: 1

defaults:
  temperature: 0.2
  max_tokens: 8192
  timeout_seconds: 120
  reasoning_effort: medium

retry_policy:
  retryable_errors:
    - rate_limit
    - timeout
    - connection
    - server_error
  non_retryable_errors:
    - invalid_request
    - authentication
  max_total_attempts: 5

agents:
  input_analyzer:
    name: input_analyzer
    description: "Analyze input and extract mathematical structure, entities, and constraints"
    tiers:
      - model: gemini/gemini-2.5-flash
        max_attempts: 2
      - model: gemini/gemini-2.5-pro
        max_attempts: 1
    temperature: 0.1
    max_tokens: 4096

  analyzer:
    name: analyzer
    description: "Alias for input_analyzer"
    tiers:
      - model: gemini/gemini-2.5-flash
        max_attempts: 2
      - model: gemini/gemini-2.5-pro
        max_attempts: 1
    temperature: 0.1
    max_tokens: 4096

  problem_parser:
    name: problem_parser
    description: "Parse problem text into structured mathematical AST"
    tiers:
      - model: gemini/gemini-2.5-flash
        max_attempts: 2
      - model: gemini/gemini-2.5-pro
        max_attempts: 1
    temperature: 0.1
    max_tokens: 8192

  parser:
    name: parser
    description: "Alias for problem_parser"
    tiers:
      - model: gemini/gemini-2.5-flash
        max_attempts: 2
      - model: gemini/gemini-2.5-pro
        max_attempts: 1
    temperature: 0.1
    max_tokens: 8192

  geometry_parser:
    name: geometry_parser
    description: "Generate geometric DSL, points, faces, solids, and spatial constraints"
    tiers:
      - model: gemini/gemini-2.5-pro
        max_attempts: 2
      - model: gemini/gemini-2.5-flash
        max_attempts: 1
    temperature: 0.1
    max_tokens: 16384

  geometry:
    name: geometry
    description: "Alias for geometry_parser"
    tiers:
      - model: gemini/gemini-2.5-pro
        max_attempts: 2
      - model: gemini/gemini-2.5-flash
        max_attempts: 1
    temperature: 0.1
    max_tokens: 16384

  reasoning_solver:
    name: reasoning_solver
    description: "Program-aided SymPy and analytical symbolic step-by-step reasoning"
    tiers:
      - model: gemini/gemini-2.5-pro
        max_attempts: 2
      - model: gemini/gemini-2.5-flash
        max_attempts: 1
    temperature: 0.2
    max_tokens: 16384
    reasoning_effort: high

  solver:
    name: solver
    description: "Alias for reasoning_solver"
    tiers:
      - model: gemini/gemini-2.5-pro
        max_attempts: 2
      - model: gemini/gemini-2.5-flash
        max_attempts: 1
    temperature: 0.2
    max_tokens: 16384
    reasoning_effort: high

  visualization_planner:
    name: visualization_planner
    description: "Plan 2D/3D camera viewpoints, highlights, annotations, and camera angles"
    tiers:
      - model: gemini/gemini-2.5-flash
        max_attempts: 2
      - model: gemini/gemini-2.5-pro
        max_attempts: 1
    temperature: 0.1
    max_tokens: 8192

  code_generator:
    name: code_generator
    description: "Generate executable Manim and Python animation scripts"
    tiers:
      - model: gemini/gemini-2.5-pro
        max_attempts: 2
      - model: gemini/gemini-2.5-flash
        max_attempts: 1
    temperature: 0.1
    max_tokens: 16384

  reviewer:
    name: reviewer
    description: "Review mathematical correctness and visual geometry consistency"
    tiers:
      - model: gemini/gemini-2.5-pro
        max_attempts: 1
      - model: gemini/gemini-2.5-flash
        max_attempts: 1
    temperature: 0.0
    max_tokens: 8192
